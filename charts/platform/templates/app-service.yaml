apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: {{ .Values.app.name }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
  - port: {{ .Values.app.service.port }}
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.app.name }}
    release: {{ .Release.Name }}
